<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://lucide.dev/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>云航 CloudNav</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#3b82f6',
              secondary: '#64748b',
              dark: '#0f172a',
              card: '#1e293b',
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      /* Custom scrollbar for sidebar */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      /* Simple CSS-only tooltip transition */
      .tooltip-custom {
          transition: opacity 0.2s, visibility 0.2s;
          pointer-events: none;
      }
      .glass-veil {
          background:
            radial-gradient(circle at 18% 12%, rgba(96, 165, 250, 0.18), transparent 34%),
            linear-gradient(180deg, rgba(2, 6, 23, 0.42), rgba(2, 6, 23, 0.68));
      }
      .glass-panel,
      .glass-card {
          position: relative;
          overflow: hidden;
          isolation: isolate;
          background: var(--glass-bg);
          border: 1px solid var(--glass-border);
          box-shadow: var(--glass-shadow);
          backdrop-filter: blur(var(--glass-blur)) saturate(145%);
          -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(145%);
      }
      .glass-card {
          background: var(--glass-card-bg);
      }
      .glass-panel::before,
      .glass-card::before {
          content: "";
          position: absolute;
          inset: 0;
          z-index: -1;
          pointer-events: none;
          background:
            linear-gradient(135deg, rgba(255,255,255,0.20), rgba(255,255,255,0.04) 34%, rgba(255,255,255,0.10)),
            radial-gradient(circle at 24% 18%, rgba(255,255,255,0.16), transparent 28%);
      }
      .glass-panel::after,
      .glass-card::after {
          content: "";
          position: absolute;
          inset: 0;
          z-index: -1;
          pointer-events: none;
          opacity: 0.22;
          background-image:
            radial-gradient(circle at 20% 30%, rgba(255,255,255,0.55) 0 1px, transparent 1px),
            radial-gradient(circle at 72% 64%, rgba(255,255,255,0.35) 0 1px, transparent 1px);
          background-size: 34px 34px, 47px 47px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "uuid": "https://aistudiocdn.com/uuid@^13.0.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "buffer": "https://aistudiocdn.com/buffer@^6.0.3",
    "jszip": "https://aistudiocdn.com/jszip@^3.10.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-50 dark:bg-slate-900 text-slate-900 dark:text-slate-50 transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
