name: Upstream Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync Upstream
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/sese972010/CloudNav-.git

      - name: Fetch upstream
        run: |
          git fetch --no-tags upstream main

      - name: Save local workflows
        run: |
          mkdir -p /tmp/local-workflows

          if [ -d .github/workflows ]; then
            cp -a .github/workflows/. /tmp/local-workflows/
          fi

      - name: Merge upstream
        run: |
          git merge upstream/main --no-edit

      - name: Restore local workflows
        run: |
          rm -rf .github/workflows
          mkdir -p .github/workflows

          if [ -d /tmp/local-workflows ]; then
            cp -a /tmp/local-workflows/. .github/workflows/
          fi

      - name: Stage changes
        run: |
          git add -A

      - name: Commit changes
        run: |
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: sync upstream CloudNav"

      - name: Push changes
        run: |
          git push origin HEAD:main
