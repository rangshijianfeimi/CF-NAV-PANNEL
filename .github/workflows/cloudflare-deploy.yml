name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy pannel
    runs-on: ubuntu-latest

    steps:
      # 1. 获取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. 检查 Cloudflare 配置
      - name: Check Wrangler configuration
        run: |
          echo "===== wrangler.toml ====="
          cat wrangler.toml

      # 4. 部署 Cloudflare Worker
      - name: Deploy Worker
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
